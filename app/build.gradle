plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def nativeAiEnabled = (project.findProperty('thirdeyeNativeAi') ?: 'false').toString().toBoolean()

android {
    namespace 'com.sliit.thirdeye'
    compileSdk 33

    defaultConfig {
        applicationId "com.sliit.thirdeye"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Vision backend settings come from local.properties (git-ignored), not source:
        //   vision.apiUrl=https://<your-cloud-run-service>.run.app
        //   vision.appToken=<the APP_TOKEN set on the backend>
        def localProps = new Properties()
        def localPropsFile = rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { localProps.load(it) }
        }
        buildConfigField "String", "VISION_API_URL", "\"${localProps.getProperty('vision.apiUrl', '')}\""
        buildConfigField "String", "VISION_APP_TOKEN", "\"${localProps.getProperty('vision.appToken', '')}\""
    }

    // Two variants with separate build folders, so they never collide with each other
    // or with files Android Studio keeps open:
    //   full  - every processor type; use for the emulator (Android Studio's default).
    //           ./gradlew assembleFullDebug  -> app/build/outputs/apk/full/debug/
    //   phone - ARM only (real phones); the x86 emulator copies of the native AI
    //           libraries are left out, roughly halving the APK.
    //           ./gradlew assemblePhoneDebug -> app/build/outputs/apk/phone/debug/
    flavorDimensions 'target'
    productFlavors {
        full {
            dimension 'target'
        }
        phone {
            dimension 'target'
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    // MediaPipe memory-maps model files straight out of the APK, so they must stay uncompressed.
    androidResources {
        noCompress 'tflite'
    }

    // Offline AI native library (whisper.cpp + llama.cpp/SmolVLM, on one ggml). Off by default so
    // the app builds without the NDK; turn on with -PthirdeyeNativeAi=true or the same line in
    // gradle.properties. Needs NDK + CMake and the sources in third_party/ (docs/OFFLINE_AI.md).
    if (nativeAiEnabled) {
        ndkVersion '26.3.11579264'
        externalNativeBuild {
            cmake {
                path 'src/main/cpp/CMakeLists.txt'
                version '3.22.1'
            }
        }
        defaultConfig {
            externalNativeBuild {
                cmake {
                    arguments "-DTHIRDEYE_WHISPER_DIR=${rootProject.file('third_party/whisper.cpp').absolutePath.replace('\\', '/')}",
                            "-DTHIRDEYE_LLAMA_DIR=${rootProject.file('third_party/llama.cpp').absolutePath.replace('\\', '/')}",
                            // ggml is ~10x slower unoptimised, so Release even in debug APKs.
                            '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_static'
                    cppFlags '-O3'
                }
            }
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // On-phone vision: MediaPipe object detector (EfficientDet-Lite2, assets/efficientdet_lite2.tflite)
    // and ML Kit image labeling (400+ labels, model bundled in the library).
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    implementation 'com.google.mlkit:image-labeling:17.0.7'
    // 1.2.3 is the newest CameraX that compiles against SDK 33 (1.3+ needs compileSdk 34 / AGP 8).
    implementation 'androidx.camera:camera-core:1.2.3'
    implementation 'androidx.camera:camera-camera2:1.2.3'
    implementation 'androidx.camera:camera-lifecycle:1.2.3'
    implementation 'androidx.camera:camera-view:1.2.3'
    // ARCore Depth API for real distances in "Around me"; optional, so the app installs everywhere.
    implementation 'com.google.ar:core:1.37.0'

//    def camerax_version = "1.1.0-beta01"
//    implementation "androidx.camera:camera-core:${camerax_version}"
//    implementation "androidx.camera:camera-camera2:${camerax_version}"
//    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
//    implementation "androidx.camera:camera-video:${camerax_version}"
//
//    implementation "androidx.camera:camera-view:${camerax_version}"
//    implementation "androidx.camera:camera-extensions:${camerax_version}"

   // def camerax_version = "1.0.0-alpha05"
   //  implementation "androidx.camera:camera-core:${camerax_version}"
    // implementation "androidx.camera:camera-camera2:${camerax_version}"

    //volley
    implementation 'com.android.volley:volley:1.2.1'

    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:18.0.2'
    // Offline OCR for Sinhala and Tamil (ML Kit only reads Latin). 4.7.0 is the newest release
    // built against SDK 33; 4.8+ needs compileSdk 34. Language files: assets/tessdata/*.traineddata.
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.7.0'

    // jsoup HTML parser library @ https://jsoup.org/
    implementation 'org.jsoup:jsoup:1.15.2'
}